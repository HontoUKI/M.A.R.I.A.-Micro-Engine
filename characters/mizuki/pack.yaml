  warmth:          {affection: 4.0,  trust: 4.0,  bond: 0.6}
  praise_work:     {affection: 4.0,  trust: 2.0,  bond: 0.5}
  # Самые крупные ходы — не вещи, а выживание: ей не нужен алмаз, ей нужно дожить до
  # завтра. Защитил — больше всего; накормил — следом.
  protected:       {affection: 7.0,  trust: 8.0,  bond: 1.0}
  fed:             {affection: 6.0,  trust: 5.0,  bond: 0.8}
  gift:            {affection: 4.0,  trust: 3.0,  bond: 0.5}
  asks_about_home: {affection: 5.0,  trust: 3.0,  bond: 0.8}
  his_story:       {affection: 3.0,  trust: 4.0,  bond: 0.6}
  # Ствол на неё — это то, с чего всё началось. Повторить это стоит дороже всего, кроме
  # убийства, и помнится почти всю серию (remembered_for).
  threatened:      {affection: -6.0, trust: -10.0, bond: -0.6}
  teasing:         {affection: 1.0,  trust: 0.5,  bond: 0.1}
  neglect:         {affection: -2.0, trust: -1.0, bond: -0.2}
