  gunfire:         {affection: 0.0,  trust: 0.0,  bond: 0.0}
  you_are_hunted:  {affection: 0.0,  trust: 0.0,  bond: 0.0}
  you_were_hurt:   {affection: 0.0,  trust: 0.0,  bond: 0.0}
  hungry:          {affection: 0.0,  trust: 0.0,  bond: 0.0}
